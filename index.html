<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazuio — em breve</title>
<meta name="description" content="Kazuio: perguntas que guiam, reflexões que conectam. Em breve.">
<style>
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background: #FEFEFE; /* fundo da versão paisagem (desktop) */
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .landing{
    max-width: 100vw;
    max-height: 100vh;
    width:auto;
    height:auto;
    object-fit: contain;
  }
  @media (max-width: 700px){
    html, body{ background: #F7EAE0; } /* fundo da versão retrato (mobile) */
  }
</style>
</head>
<body>
  <picture>
    <source media="(max-width: 700px)" srcset="images/kazuio-landing-mobile.png">
    <img class="landing" src="images/kazuio-landing.png" alt="Kazuio — perguntas que guiam, reflexões que conectam. Em breve.">
  </picture>
</body>
</html>
